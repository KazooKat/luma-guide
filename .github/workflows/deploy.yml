name: Test and deploy

# The site is served by Cloudflare (Workers static assets, see wrangler.jsonc). GitHub Pages only serves
# redirect/index.html, which forwards old kazookat.github.io/luma-guide links (keeping the #/ route) to it.
# The redirect is only published after the Cloudflare deploy succeeds, so a failed deploy leaves Pages as it was.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Prepare the GitHub Pages redirect
        run: cp redirect/index.html redirect/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  pages-redirect:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
